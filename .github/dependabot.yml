version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(actions)"
