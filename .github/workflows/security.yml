name: Security

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "meta/**"
      - "phase*/**"
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and secret audit
    runs-on: [self-hosted, Linux, X64, cortexa-ci]
    timeout-minutes: 30
    steps:
      - name: Verify self-hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          command -v git
          command -v python3
          command -v rustup
          command -v cargo

      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Scan tracked content for secret patterns
        run: npm run security:scan

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked --root "${RUNNER_TEMP}/cargo-audit"

      - name: Audit Rust dependencies against the accepted baseline
        shell: bash
        run: |
          set +e
          PATH="${RUNNER_TEMP}/cargo-audit/bin:${PATH}" cargo audit --file src-tauri/Cargo.lock --json > "${RUNNER_TEMP}/cargo-audit.json"
          audit_status=$?
          set -e
          python3 scripts/cargo_audit_gate.py "${RUNNER_TEMP}/cargo-audit.json" --cargo-audit-exit "${audit_status}"
