name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "meta/**"
      - "phase*/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full repository verification
    runs-on: [self-hosted, Linux, X64, cortexa-ci]
    timeout-minutes: 45
    steps:
      - name: Verify self-hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          command -v git
          command -v python3
          command -v rustup
          command -v cargo
          command -v pkg-config
          pkg-config --exists webkit2gtk-4.1
          pkg-config --exists javascriptcoregtk-4.1
          pkg-config --exists gtk+-3.0

      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run complete repository verification
        run: npm run verify
