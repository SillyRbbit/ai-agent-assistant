name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full repository verification
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run complete repository verification
        run: npm run verify
