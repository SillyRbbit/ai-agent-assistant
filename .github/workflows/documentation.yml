name: Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "prompts/**"
      - ".agents/**"
      - "assets/branding/**"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".github/CODEOWNERS"
      - ".gitignore"
      - ".prettierignore"
      - ".prettierrc*"
      - "LICENSE*"
      - "package.json"
      - "package-lock.json"
      - "scripts/repository_health.py"
      - "scripts/tests/test_repository_health.py"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "prompts/**"
      - ".agents/**"
      - "assets/branding/**"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".github/CODEOWNERS"
      - ".gitignore"
      - ".prettierignore"
      - ".prettierrc*"
      - "LICENSE*"
      - "package.json"
      - "package-lock.json"
      - "scripts/repository_health.py"
      - "scripts/tests/test_repository_health.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Check changed lines for whitespace errors
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/ci_change_scope.py diff-check
          --event "${CI_EVENT_NAME}"
          --base "${CI_BASE_SHA}"
          --head "${CI_HEAD_SHA}"

      - name: Check Markdown, YAML, links, and prompt paths
        run: npm run docs:check

      - name: Check repository governance and tracked content
        run: npm run repository:check
