name: Documentation

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "meta/**"
      - "phase*/**"
    paths:
      - "**/*.md"
      - ".github/**"
      - ".gitignore"
      - "assets/branding/**"
      - "package.json"
      - "scripts/repository_health.py"
      - "scripts/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and repository policy
    runs-on: [self-hosted, Linux, X64, cortexa-ci]
    timeout-minutes: 15
    steps:
      - name: Verify self-hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          command -v git
          command -v python3

      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Check Markdown, YAML, links, and repository policy
        run: npm run docs:check && npm run repository:check
