    <rect x="244" y="12" width="72" height="20" rx="10" class="pill-planned"/>
    <text x="280" y="26" text-anchor="middle" class="pill-text">PLANNED</text>
    <circle cx="35" cy="35" r="14" class="icon"/>
    <circle cx="66" cy="25" r="8" class="icon"/>
    <circle cx="66" cy="51" r="8" class="icon"/>
    <line x1="49" y1="31" x2="58" y2="27" class="icon"/>
    <line x1="49" y1="39" x2="58" y2="47" class="icon"/>
