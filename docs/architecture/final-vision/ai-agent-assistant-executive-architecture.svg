    <line x1="30" y1="58" x2="54" y2="58" class="icon"/>
    <text x="78" y="45" class="card-title">macOS desktop</text>
    <text x="78" y="68" class="card-copy">Current shell · mocked assistant</text>
  </g>

  <g transform="translate(88 362)">
