<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cortexa completed-vision executive architecture</title>
  <desc id="desc">A six-part visual story showing a user working with a trusted AI assistant, local orchestration and controls, controlled tools, intelligence and data services, and business governance.</desc>

  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #182033;
      }

      .eyebrow {
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 1.6px;
        fill: #477987;
      }

      .title {
        font-size: 48px;
        font-weight: 760;
        letter-spacing: -1px;
        fill: #252b71;
      }

      .subtitle {
        font-size: 19px;
        font-weight: 520;
        fill: #4758a2;
      }

      .zone-label {
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 1.2px;
        fill: #667085;
      }

      .step-number {
        font-size: 17px;
        font-weight: 760;
        fill: #fbfbfb;
      }

      .step-kicker {
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 1px;
        fill: #477987;
      }

      .step-title {
        font-size: 25px;
        font-weight: 740;
        letter-spacing: -.2px;
        fill: #252b71;
      }

      .step-copy {
        font-size: 15px;
        font-weight: 520;
        fill: #475467;
      }

      .support-title {
        font-size: 17px;
        font-weight: 720;
        fill: #252b71;
      }

      .support-copy {
        font-size: 13px;
        font-weight: 520;
        fill: #475467;
      }

      .governance-title {
        font-size: 21px;
        font-weight: 730;
        fill: #fbfbfb;
      }

      .governance-subtitle {
        font-size: 14px;
        font-weight: 520;
        fill: #c9d2e3;
      }

      .governance-label {
        font-size: 12px;
        font-weight: 760;
        letter-spacing: .7px;
        fill: #9abfc6;
      }

      .governance-copy {
        font-size: 14px;
        font-weight: 600;
        fill: #fbfbfb;
      }

      .status-text {
        font-size: 10px;
        font-weight: 760;
        letter-spacing: .65px;
      }

      .legend-text {
        font-size: 12px;
        font-weight: 650;
        fill: #475467;
      }

      .warning {
        font-size: 12px;
        font-weight: 760;
        fill: #b42318;
      }

      .story-card {
        fill: #fff;
        stroke: #d9dee8;
        stroke-width: 2;
      }

      .story-card-core {
        fill: #f8fafd;
        stroke: #4758a2;
        stroke-width: 2.5;
      }

      .current {
        fill: #e9f3f4;
        stroke: #477987;
        stroke-width: 1.8;
      }

      .planned {
        fill: #f1f4fa;
        stroke: #6c89ba;
        stroke-width: 1.8;
        stroke-dasharray: 7 5;
      }

      .optional {
        fill: #f5f6f8;
        stroke: #8a93a4;
        stroke-width: 1.8;
        stroke-dasharray: 2 5;
      }

      .external {
        fill: #fbfbfb;
        stroke: #182033;
        stroke-width: 1.8;
      }

      .icon {
        fill: none;
        stroke: #252b71;
        stroke-width: 2.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-teal {
        fill: none;
        stroke: #477987;
        stroke-width: 2.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .flow {
        fill: none;
        stroke: #4758a2;
        stroke-width: 4;
        marker-end: url(#arrow);
      }

      .support-flow {
        fill: none;
        stroke: #6c89ba;
        stroke-width: 2.5;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow-soft);
      }

      .boundary {
        fill: none;
        stroke: #9abfc6;
        stroke-width: 1.7;
        stroke-dasharray: 7 7;
      }
    </style>

    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#4758a2"/>
    </marker>

    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6c89ba"/>
    </marker>

    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#182033" flood-opacity=".09"/>
    </filter>

    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#182033" flood-opacity=".06"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1920" height="1080" fill="#fbfbfb"/>
  <rect width="1920" height="10" fill="#252b71"/>

  <!-- Title -->
  <text x="64" y="54" class="eyebrow">COMPLETED-VISION ARCHITECTURE</text>
  <text x="64" y="105" class="title">Cortexa</text>
  <text x="64" y="142" class="subtitle">An intelligent, secure, cross-platform executive assistant that can understand, coordinate, and perform work while keeping the user in control.</text>

  <!-- Status legend -->
  <g transform="translate(1380 48)">
    <rect x="0" y="0" width="18" height="18" rx="4" class="current"/>
    <text x="26" y="14" class="legend-text">Current</text>
    <rect x="105" y="0" width="18" height="18" rx="4" class="planned"/>
    <text x="131" y="14" class="legend-text">Planned</text>
    <rect x="214" y="0" width="18" height="18" rx="4" class="optional"/>
    <text x="240" y="14" class="legend-text">Optional</text>
    <rect x="329" y="0" width="18" height="18" rx="4" class="external"/>
    <text x="355" y="14" class="legend-text">External</text>
  </g>

  <line x1="64" y1="172" x2="1856" y2="172" stroke="#d9dee8" stroke-width="2"/>

  <!-- Trust-zone labels -->
  <text x="74" y="210" class="zone-label">HUMAN AUTHORITY</text>
  <text x="414" y="210" class="zone-label">TRUSTED LOCAL CONTROL</text>
  <text x="1438" y="210" class="zone-label">CONTROLLED EFFECTS</text>
  <rect x="394" y="190" width="1010" height="390" rx="24" class="boundary"/>

  <!-- Step 1 -->
  <g transform="translate(64 232)" filter="url(#shadow)">
    <rect width="300" height="324" rx="22" class="story-card"/>
  </g>
  <g transform="translate(64 232)">
    <circle cx="34" cy="34" r="22" fill="#252b71"/>
    <text x="34" y="40" text-anchor="middle" class="step-number">1</text>
    <rect x="205" y="18" width="77" height="22" rx="11" fill="#e9f3f4"/>
    <text x="243.5" y="33" text-anchor="middle" class="status-text" fill="#477987">CURRENT</text>

    <circle cx="150" cy="103" r="41" fill="#f1f4fa"/>
    <circle cx="150" cy="90" r="13" class="icon"/>
    <path d="M124 127c5-16 15-24 26-24s21 8 26 24" class="icon"/>
    <path d="M104 76h-18v35h16l13 11v-11h9" class="icon-teal"/>

    <text x="28" y="170" class="step-kicker">ASK</text>
    <text x="28" y="204" class="step-title">Set the goal</text>
    <text x="28" y="238" class="step-copy">Talk naturally, share context,</text>
    <text x="28" y="261" class="step-copy">and stay visibly in control.</text>

    <g transform="translate(28 282)">
      <rect width="88" height="25" rx="12.5" fill="#e9f3f4"/>
      <text x="44" y="17" text-anchor="middle" class="status-text" fill="#477987">macOS NOW</text>
      <rect x="96" width="148" height="25" rx="12.5" fill="#f1f4fa" stroke="#6c89ba" stroke-dasharray="5 4"/>
      <text x="170" y="17" text-anchor="middle" class="status-text" fill="#6c89ba">WINDOWS + LINUX</text>
    </g>
  </g>

  <!-- Step 2 -->
  <g transform="translate(406 232)" filter="url(#shadow)">
    <rect width="300" height="324" rx="22" class="story-card-core"/>
  </g>
  <g transform="translate(406 232)">
    <circle cx="34" cy="34" r="22" fill="#252b71"/>
    <text x="34" y="40" text-anchor="middle" class="step-number">2</text>
    <rect x="179" y="18" width="103" height="22" rx="11" fill="#e9f3f4"/>
    <text x="230.5" y="33" text-anchor="middle" class="status-text" fill="#477987">MOCKED TODAY</text>

    <circle cx="150" cy="103" r="41" fill="#e9f3f4"/>
    <path d="M150 71v64M118 103h64" class="icon-teal"/>
    <circle cx="150" cy="103" r="23" class="icon"/>
    <circle cx="150" cy="103" r="6" fill="#252b71"/>

    <text x="28" y="170" class="step-kicker">UNDERSTAND</text>
    <text x="28" y="204" class="step-title">Trusted assistant</text>
    <text x="28" y="238" class="step-copy">Builds shared understanding</text>
    <text x="28" y="261" class="step-copy">with transparent context.</text>

    <rect x="28" y="282" width="244" height="25" rx="12.5" fill="#e9f3f4"/>
    <text x="150" y="299" text-anchor="middle" class="status-text" fill="#477987">CURRENT EXPERIENCE · MOCK LOOP</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(748 232)" filter="url(#shadow)">
    <rect width="300" height="324" rx="22" class="story-card-core"/>
  </g>
  <g transform="translate(748 232)">
    <circle cx="34" cy="34" r="22" fill="#252b71"/>
    <text x="34" y="40" text-anchor="middle" class="step-number">3</text>
    <rect x="205" y="18" width="77" height="22" rx="11" fill="#f1f4fa" stroke="#6c89ba" stroke-dasharray="5 4"/>
    <text x="243.5" y="33" text-anchor="middle" class="status-text" fill="#6c89ba">PLANNED</text>

    <circle cx="150" cy="103" r="41" fill="#f1f4fa"/>
    <circle cx="126" cy="103" r="10" class="icon"/>
    <circle cx="167" cy="83" r="9" class="icon"/>
    <circle cx="174" cy="122" r="9" class="icon"/>
    <path d="M136 99l22-12M136 108l29 11" class="icon-teal"/>

    <text x="28" y="170" class="step-kicker">COORDINATE</text>
    <text x="28" y="204" class="step-title">Plan the work</text>
    <text x="28" y="238" class="step-copy">Breaks goals into bounded tasks</text>
    <text x="28" y="261" class="step-copy">and routes them deliberately.</text>

    <rect x="28" y="282" width="244" height="25" rx="12.5" fill="#f1f4fa" stroke="#6c89ba" stroke-dasharray="5 4"/>
    <text x="150" y="299" text-anchor="middle" class="status-text" fill="#6c89ba">ORCHESTRATION · OPTIONAL SPECIALISTS</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1090 232)" filter="url(#shadow)">
    <rect width="300" height="324" rx="22" class="story-card-core"/>
  </g>
  <g transform="translate(1090 232)">
    <circle cx="34" cy="34" r="22" fill="#252b71"/>
    <text x="34" y="40" text-anchor="middle" class="step-number">4</text>
    <rect x="157" y="18" width="125" height="22" rx="11" fill="#e9f3f4"/>
    <text x="219.5" y="33" text-anchor="middle" class="status-text" fill="#477987">CURRENT CONTRACTS</text>

    <circle cx="150" cy="103" r="41" fill="#e9f3f4"/>
    <path d="M150 68l28 13v21c0 20-13 33-28 42-15-9-28-22-28-42V81Z" class="icon"/>
    <path d="M137 104l9 9 18-22" class="icon-teal"/>

    <text x="28" y="170" class="step-kicker">PROTECT</text>
    <text x="28" y="204" class="step-title">Control actions</text>
    <text x="28" y="238" class="step-copy">Policy checks risk. Important</text>
    <text x="28" y="261" class="step-copy">actions wait for your approval.</text>

    <rect x="28" y="282" width="244" height="25" rx="12.5" fill="#f1f4fa" stroke="#6c89ba" stroke-dasharray="5 4"/>
    <text x="150" y="299" text-anchor="middle" class="status-text" fill="#6c89ba">END-TO-END ENFORCEMENT PLANNED</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(1432 232)" filter="url(#shadow)">
    <rect width="424" height="324" rx="22" class="story-card"/>
  </g>
  <g transform="translate(1432 232)">
    <circle cx="34" cy="34" r="22" fill="#252b71"/>
    <text x="34" y="40" text-anchor="middle" class="step-number">5</text>
    <rect x="329" y="18" width="77" height="22" rx="11" fill="#f1f4fa" stroke="#6c89ba" stroke-dasharray="5 4"/>
    <text x="367.5" y="33" text-anchor="middle" class="status-text" fill="#6c89ba">PLANNED</text>

    <circle cx="102" cy="103" r="41" fill="#f1f4fa"/>
    <rect x="77" y="83" width="50" height="38" rx="7" class="icon"/>
    <path d="M87 96h30M87 106h21" class="icon-teal"/>

    <g transform="translate(178 68)">
      <rect width="214" height="76" rx="14" class="external"/>
      <path d="M18 25h29v23H18Z M18 25l14.5 12L47 25" class="icon"/>
      <rect x="60" y="16" width="1" height="44" fill="#d9dee8"/>
      <rect x="77" y="21" width="27" height="26" rx="3" class="icon"/>
      <line x1="77" y1="29" x2="104" y2="29" class="icon"/>
      <path d="M130 47V27h20l7 7h18v13Z" class="icon"/>
    </g>

    <text x="28" y="170" class="step-kicker">PERFORM</text>
    <text x="28" y="204" class="step-title">Get work done</text>
    <text x="28" y="238" class="step-copy">Least-privilege tools connect to devices,</text>
    <text x="28" y="261" class="step-copy">email, calendars, files, cloud and business apps.</text>

    <rect x="28" y="282" width="368" height="25" rx="12.5" fill="#f1f4fa" stroke="#6c89ba" stroke-dasharray="5 4"/>
    <text x="212" y="299" text-anchor="middle" class="status-text" fill="#6c89ba">RESTRICTED TOOLS · APPROVED SERVICES</text>
  </g>

  <!-- Main story arrows -->
  <path d="M364 394H394" class="flow"/>
  <path d="M706 394H736" class="flow"/>
  <path d="M1048 394H1078" class="flow"/>
  <path d="M1390 394H1420" class="flow"/>

  <!-- Intelligence and data foundation -->
  <g transform="translate(64 612)">
    <rect width="1792" height="188" rx="22" fill="#f1f4fa" stroke="#d9dee8" stroke-width="2"/>
    <circle cx="34" cy="34" r="22" fill="#4758a2"/>
    <text x="34" y="40" text-anchor="middle" class="step-number">6</text>
    <text x="70" y="31" class="step-kicker">SUPPORT</text>
    <text x="70" y="57" class="support-title">Intelligence, memory and secure data services strengthen every interaction</text>

    <g transform="translate(28 82)">
      <rect width="400" height="78" rx="15" class="external"/>
      <path d="M27 46c0-9 7-16 16-16 6 0 12 4 15 9 3-2 6-3 10-3 9 0 16 7 16 16H27Z" class="icon"/>
      <text x="104" y="32" class="support-title">Approved cloud models</text>
      <text x="104" y="55" class="support-copy">External intelligence · no device authority</text>
    </g>

    <g transform="translate(452 82)">
      <rect width="400" height="78" rx="15" class="planned"/>
      <ellipse cx="46" cy="27" rx="19" ry="8" class="icon"/>
      <path d="M27 27v28c0 5 9 8 19 8s19-3 19-8V27M27 41c0 5 9 8 19 8s19-3 19-8" class="icon"/>
      <text x="90" y="32" class="support-title">Memory + secure local data</text>
      <text x="90" y="55" class="support-copy">Encrypted, user-controlled, retention-aware</text>
    </g>

    <g transform="translate(876 82)">
      <rect width="400" height="78" rx="15" class="planned"/>
      <path d="M28 24h30l10 10v28H28Z M58 24v11h10" class="icon"/>
      <path d="M38 45h20M38 54h15" class="icon-teal"/>
      <text x="90" y="32" class="support-title">Retrieval + knowledge</text>
      <text x="90" y="55" class="support-copy">Curated context · optional semantic index</text>
    </g>

    <g transform="translate(1300 82)">
      <rect width="464" height="78" rx="15" class="optional"/>
      <circle cx="47" cy="43" r="21" class="icon"/>
      <path d="M37 43h20M47 33v20" class="icon-teal"/>
      <text x="88" y="32" class="support-title">Optional local intelligence</text>
      <text x="88" y="55" class="support-copy">Local models and future private processing</text>
    </g>
  </g>

  <path d="M522 612V584H556V566" class="support-flow"/>
  <path d="M976 612V584H898V566" class="support-flow"/>
  <path d="M1470 612V584H1240V566" class="support-flow"/>

  <!-- Business governance foundation -->
  <g transform="translate(64 824)">
    <rect width="1792" height="184" rx="22" fill="#182033"/>
    <path d="M34 40l19-9 19 9v14c0 14-9 23-19 29-10-6-19-15-19-29Z" class="icon-teal"/>
    <text x="88" y="47" class="governance-title">Business-ready governance</text>
    <text x="88" y="72" class="governance-subtitle">A durable control plane makes actions explainable, reviewable and reversible.</text>

    <g transform="translate(28 105)">
      <text x="0" y="0" class="governance-label">USER CONSENT</text>
      <text x="0" y="28" class="governance-copy">Preview · approve · cancel</text>
    </g>
    <g transform="translate(346 105)">
      <text x="0" y="0" class="governance-label">POLICY + LEAST PRIVILEGE</text>
      <text x="0" y="28" class="governance-copy">Risk checks · narrow permissions</text>
    </g>
    <g transform="translate(736 105)">
      <text x="0" y="0" class="governance-label">SECRETS + ENCRYPTION</text>
      <text x="0" y="28" class="governance-copy">Protected credentials · encrypted data</text>
    </g>
    <g transform="translate(1122 105)">
      <text x="0" y="0" class="governance-label">AUDIT + ACCOUNTABILITY</text>
      <text x="0" y="28" class="governance-copy">Redacted lifecycle · verified outcomes</text>
    </g>
    <g transform="translate(1492 105)">
      <text x="0" y="0" class="governance-label">DATA BOUNDARIES</text>
      <text x="0" y="28" class="governance-copy">Local-first · disclosed external use</text>
    </g>
  </g>

  <!-- Prohibited-path callout and evidence note -->
  <g transform="translate(1325 785)">
    <line x1="0" y1="0" x2="505" y2="0" stroke="#b42318" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="22" cy="0" r="10" fill="#fbfbfb" stroke="#b42318" stroke-width="2"/>
    <line x1="15" y1="-7" x2="29" y2="7" stroke="#b42318" stroke-width="2"/>
    <text x="42" y="5" class="warning">NO DIRECT MODEL-TO-DEVICE PATH</text>
  </g>

  <text x="64" y="1042" font-size="11" font-weight="600" fill="#667085">Vision diagram · status reflects repository evidence as of 2026-07-29 · planned and optional capabilities require separate approval and verification</text>
</svg>
