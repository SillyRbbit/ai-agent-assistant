<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cortexa completed-vision executive architecture</title>
  <desc id="desc">An executive architecture view distinguishing current, planned, conceptual, and external components of the Cortexa local-first executive assistant.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #182033; }
      .title { font-size: 38px; font-weight: 700; fill: #252B71; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #4758A2; }
      .layer-title { font-size: 20px; font-weight: 700; fill: #252B71; }
      .layer-subtitle { font-size: 14px; font-weight: 500; fill: #4758A2; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-copy { font-size: 13px; font-weight: 500; fill: #4758A2; }
      .small { font-size: 12px; font-weight: 600; }
      .legend { font-size: 13px; font-weight: 600; }
      .implemented { fill: #E9F3F4; stroke: #4758A2; stroke-width: 2; }
      .planned { fill: #F1F4FA; stroke: #6C89BA; stroke-width: 2; stroke-dasharray: 8 5; }
      .optional { fill: #F5F6F8; stroke: #8A93A4; stroke-width: 2; stroke-dasharray: 3 5; }
      .external { fill: #FBFBFB; stroke: #182033; stroke-width: 2; }
      .container { fill: #FFFFFF; stroke: #D9DEE8; stroke-width: 2; }
      .core-container { fill: #F8FAFD; stroke: #252B71; stroke-width: 3; }
      .pill-current { fill: #252B71; }
      .pill-planned { fill: #6C89BA; }
      .pill-optional { fill: #8A93A4; }
      .pill-external { fill: #182033; }
      .pill-text { font-size: 10px; font-weight: 700; fill: #FBFBFB; letter-spacing: .6px; }
      .rail-title { fill: #FBFBFB; }
      .rail-label { fill: #9ABFC6; }
      .warning { fill: #B42318; }
      .flow { fill: none; stroke: #4758A2; stroke-width: 3; marker-end: url(#arrow); }
      .future-flow { fill: none; stroke: #6C89BA; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow-future); }
      .trust { fill: none; stroke: #9ABFC6; stroke-width: 2; stroke-dasharray: 5 6; }
      .icon { fill: none; stroke: #252B71; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-light { fill: none; stroke: #9ABFC6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4758A2"/>
    </marker>
    <marker id="arrow-future" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6C89BA"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#182033" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FBFBFB"/>
  <rect x="0" y="0" width="1920" height="10" fill="#252B71"/>

  <text x="60" y="65" class="title">Cortexa · Completed Vision</text>
  <text x="60" y="101" class="subtitle">A local-first executive assistant with deterministic control between AI intent and real-world action</text>

  <g transform="translate(1190 42)">
    <text x="0" y="15" class="legend">STATUS</text>
    <rect x="72" y="0" width="20" height="20" rx="4" class="implemented"/>
    <text x="100" y="15" class="legend">Current</text>
    <rect x="187" y="0" width="20" height="20" rx="4" class="planned"/>
    <text x="215" y="15" class="legend">Planned</text>
    <rect x="305" y="0" width="20" height="20" rx="4" class="optional"/>
    <text x="333" y="15" class="legend">Optional</text>
    <rect x="430" y="0" width="20" height="20" rx="4" class="external"/>
    <text x="458" y="15" class="legend">External</text>
  </g>

  <line x1="60" y1="128" x2="1860" y2="128" stroke="#D9DEE8" stroke-width="2"/>

