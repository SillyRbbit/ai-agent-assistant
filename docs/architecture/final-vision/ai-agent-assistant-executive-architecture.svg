      <rect width="36" height="30"/>
      <line x1="18" y1="0" x2="18" y2="30"/>
      <line x1="0" y1="15" x2="36" y2="15"/>
    </g>
    <text x="78" y="39" class="card-title">Windows + Linux</text>
    <text x="78" y="61" class="card-copy">Portable clients and adapters</text>
  </g>

  <g transform="translate(88 462)">
