    <text x="90" y="67" class="card-copy">Run lifecycle · planning · routing</text>
  </g>

  <g transform="translate(450 370)">
    <rect width="200" height="98" rx="14" class="implemented"/>
    <text x="18" y="31" class="card-title">ToolRegistry</text>
    <text x="18" y="55" class="card-copy">Strict schemas</text>
    <text x="18" y="76" class="card-copy">Closed tool catalog</text>
  </g>
  <g transform="translate(670 370)">
    <rect width="200" height="98" rx="14" class="implemented"/>
    <text x="18" y="31" class="card-title">PolicyEngine</text>
    <text x="18" y="55" class="card-copy">Risk classification</text>
    <text x="18" y="76" class="card-copy">Fail-closed rules</text>
  </g>
  <g transform="translate(890 370)">
