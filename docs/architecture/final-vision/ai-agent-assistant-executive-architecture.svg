    <rect x="18" y="17" width="35" height="30" rx="4" class="icon"/>
    <line x1="28" y1="27" x2="43" y2="27" class="icon"/>
    <line x1="28" y1="36" x2="43" y2="36" class="icon"/>
    <text x="74" y="28" class="card-title">Third-party integrations</text>
