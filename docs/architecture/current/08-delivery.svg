<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1456" role="img" aria-labelledby="title desc">
<title id="title">08 · Development and delivery</title><desc id="desc">Development pipeline is separate from native request execution. CI content permissions are read-only; ordinary jobs make no live requests. Self-hosted administration is an external trust boundary. No product tests/builds/live requests repeated for these diagrams.</desc>
