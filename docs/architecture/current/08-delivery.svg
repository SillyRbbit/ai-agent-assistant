<text x="733" y="147" font-size="15" font-weight="400" fill="#182033" text-anchor="start">Deferred / unverified</text>
<text x="40" y="190" font-size="20" font-weight="700" fill="#182033" text-anchor="start">Owner-approved local increment</text>
