<text x="56.0" y="239" font-size="14" font-weight="700" fill="#94642c" text-anchor="start">DEV</text>
<text x="56.0" y="268" font-size="19" font-weight="700" fill="#182033" text-anchor="start">Source + exact scope</text>
<text x="56.0" y="301" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Preserve work; ordinary admission and living</text>
<text x="56.0" y="322" font-size="16" font-weight="400" fill="#182033" text-anchor="start">plan.</text>
</g>
