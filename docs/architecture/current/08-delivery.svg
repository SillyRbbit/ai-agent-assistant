<text x="40" y="47" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">08 · Development and delivery</text>
<text x="40" y="81" font-size="19" font-weight="400" fill="#ffffff" text-anchor="start">Development pipeline is separate from native request execution</text>
<rect x="40" y="132" width="18" height="18" fill="#eef1fb" stroke="#4758A2"/>
