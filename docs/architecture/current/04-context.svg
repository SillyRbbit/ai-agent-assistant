<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1456" role="img" aria-labelledby="title desc">
<title id="title">04 · Identity, instructions and memory</title><desc id="desc">Separate stores and sharing rules; none grants device authority. Knowledge provides Markdown, versions, stable links, bounded graph and owner import/export. No embedding retrieval, external vault sync or automatic private-memory learning is established.</desc>
