<text x="1043.3333333333335" y="1138" font-size="13" font-weight="600" fill="#252B71" text-anchor="middle">link</text>
<g data-component="POLICY / TOOLS"><rect x="1093.3333333333335" y="1060" width="426.6666666666667" height="204" rx="12" fill="#f1eff7" stroke="#79628d" stroke-width="2" stroke-dasharray="7 4"/>
<text x="1109.3333333333335" y="1085" font-size="14" font-weight="700" fill="#79628d" text-anchor="start">POLICY / TOOLS</text>
<text x="1109.3333333333335" y="1114" font-size="19" font-weight="700" fill="#182033" text-anchor="start">Separate foundations</text>
