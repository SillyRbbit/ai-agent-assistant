<text x="43" y="1287" font-size="14" font-weight="400" fill="#49516a" text-anchor="start">Evidence: DOCS, KNOW, DB, DIAG, POLICY, TOOLS</text>
<text x="40" y="1352" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Roles/prompts are not enforced controls. A directory is not a sandbox. Runtime flags are not a full isolation audit. Prompt injection can influence text; schema</text>
<text x="40" y="1374" font-size="16" font-weight="400" fill="#182033" text-anchor="start">validation does not establish truth.</text>
