<text x="582.6666666666667" y="521" font-size="14" font-weight="700" fill="#934873" text-anchor="start">REMOTE</text>
<text x="582.6666666666667" y="550" font-size="19" font-weight="700" fill="#182033" text-anchor="start">OpenAI Responses</text>
<text x="582.6666666666667" y="583" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Selected context leaves device; store=false ≠</text>
<text x="582.6666666666667" y="604" font-size="16" font-weight="400" fill="#182033" text-anchor="start">zero retention.</text>
