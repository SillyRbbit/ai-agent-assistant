<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1456" role="img" aria-labelledby="title desc">
<title id="title">07 · Security and outbound data</title><desc id="desc">Native typed boundaries; model text and WebView input remain untrusted. Roles/prompts are not enforced controls. A directory is not a sandbox. Runtime flags are not a full isolation audit. Prompt injection can influence text; schema validation does not establish truth.</desc>
