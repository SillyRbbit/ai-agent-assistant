<text x="43" y="1287" font-size="14" font-weight="400" fill="#49516a" text-anchor="start">Evidence: CHAT, CTX, DIAG</text>
<text x="40" y="1352" font-size="16" font-weight="400" fill="#182033" text-anchor="start">No general tool-action stage exists here. Simulation needs no remote authentication. Collaboration instead persists room snapshots. Partial text alone does not</text>
