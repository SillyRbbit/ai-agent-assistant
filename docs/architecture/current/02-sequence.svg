<g data-component="CHAT"><rect x="40.0" y="1060" width="426.6666666666667" height="204" rx="12" fill="#eef1fb" stroke="#4758A2" stroke-width="2"/>
<text x="56.0" y="1085" font-size="14" font-weight="700" fill="#4758A2" text-anchor="start">CHAT</text>
<text x="56.0" y="1114" font-size="19" font-weight="700" fill="#182033" text-anchor="start">10 · Release ownership</text>
<text x="56.0" y="1147" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Abort/join or verified completion; release</text>
<text x="56.0" y="1168" font-size="16" font-weight="400" fill="#182033" text-anchor="start">generation lease.</text>
