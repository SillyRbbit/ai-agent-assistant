<text x="538" y="147" font-size="15" font-weight="400" fill="#182033" text-anchor="start">Separate foundation</text>
<rect x="706" y="132" width="18" height="18" fill="#ffffff" stroke="#79628d" stroke-dasharray="6 4"/>
<text x="733" y="147" font-size="15" font-weight="400" fill="#182033" text-anchor="start">Deferred / unverified</text>
<text x="40" y="190" font-size="20" font-weight="700" fill="#182033" text-anchor="start">1–3 · Before generation</text>
<g data-component="OWNER"><rect x="40.0" y="214" width="426.6666666666667" height="204" rx="12" fill="#fff4db" stroke="#94642c" stroke-width="2"/>
<text x="56.0" y="239" font-size="14" font-weight="700" fill="#94642c" text-anchor="start">OWNER</text>
<text x="56.0" y="268" font-size="19" font-weight="700" fill="#182033" text-anchor="start">1 · Select and review</text>
<text x="56.0" y="301" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Bots → saved profile → fresh conversation.</text>
</g>
<line x1="472.6666666666667" y1="318" x2="557.6666666666667" y2="318" stroke="#4758A2" stroke-width="2" marker-end="url(#arrow)"/>
