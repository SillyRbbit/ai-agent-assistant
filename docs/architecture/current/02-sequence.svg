<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1456" role="img" aria-labelledby="title desc">
<title id="title">02 · Prompt to completion</title><desc id="desc">Single-bot native path; numbered rows continue in order. No general tool-action stage exists here. Simulation needs no remote authentication. Collaboration instead persists room snapshots. Partial text alone does not prove completion.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4758A2"/></marker></defs>
<rect width="1560" height="1456" fill="#FBFBFB"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1560" height="112" fill="#252B71"/>
<text x="40" y="47" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">02 · Prompt to completion</text>
<text x="40" y="81" font-size="19" font-weight="400" fill="#ffffff" text-anchor="start">Single-bot native path; numbered rows continue in order</text>
<rect x="40" y="132" width="18" height="18" fill="#eef1fb" stroke="#4758A2"/>
<text x="67" y="147" font-size="15" font-weight="400" fill="#182033" text-anchor="start">Native</text>
