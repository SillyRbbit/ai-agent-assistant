<text x="1109.3333333333335" y="268" font-size="19" font-weight="700" fill="#182033" text-anchor="start">3 · Build context</text>
<text x="1109.3333333333335" y="301" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Role + untrusted owner context + completed</text>
<text x="1109.3333333333335" y="322" font-size="16" font-weight="400" fill="#182033" text-anchor="start">turns; Off omits note.</text>
</g>
<text x="43" y="441" font-size="14" font-weight="400" fill="#49516a" text-anchor="start">Evidence: UI, PROFILE, CTX</text>
<text x="40" y="472" font-size="20" font-weight="700" fill="#182033" text-anchor="start">4–6 · Native admission</text>
<g data-component="UI"><rect x="40.0" y="496" width="426.6666666666667" height="204" rx="12" fill="#e7f3f5" stroke="#326672" stroke-width="2"/>
<text x="56.0" y="521" font-size="14" font-weight="700" fill="#326672" text-anchor="start">UI</text>
<text x="56.0" y="550" font-size="19" font-weight="700" fill="#182033" text-anchor="start">4 · Acknowledge Send</text>
<text x="56.0" y="583" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Exact prompt and context-sharing</text>
<text x="56.0" y="604" font-size="16" font-weight="400" fill="#182033" text-anchor="start">acknowledgement.</text>
