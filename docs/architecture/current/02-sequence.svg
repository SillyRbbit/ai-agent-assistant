<text x="582.6666666666667" y="301" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Connection, model, effort, identity,</text>
<text x="582.6666666666667" y="322" font-size="16" font-weight="400" fill="#182033" text-anchor="start">instructions and memory.</text>
