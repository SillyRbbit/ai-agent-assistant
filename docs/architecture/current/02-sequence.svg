<g data-component="CHAT"><rect x="566.6666666666667" y="496" width="426.6666666666667" height="204" rx="12" fill="#eef1fb" stroke="#4758A2" stroke-width="2"/>
<text x="582.6666666666667" y="521" font-size="14" font-weight="700" fill="#4758A2" text-anchor="start">CHAT</text>
<text x="582.6666666666667" y="550" font-size="19" font-weight="700" fill="#182033" text-anchor="start">5 · Validate + lease</text>
<text x="582.6666666666667" y="583" font-size="16" font-weight="400" fill="#182033" text-anchor="start">Reject stale revision, busy ownership or</text>
<text x="582.6666666666667" y="604" font-size="16" font-weight="400" fill="#182033" text-anchor="start">invalid bounds.</text>
</g>
<line x1="999.3333333333335" y1="600" x2="1084.3333333333335" y2="600" stroke="#4758A2" stroke-width="2" marker-end="url(#arrow)"/>
