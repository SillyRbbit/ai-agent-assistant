<text x="1043.3333333333335" y="574" font-size="13" font-weight="600" fill="#252B71" text-anchor="middle">request</text>
<g data-component="ADAPTER"><rect x="1093.3333333333335" y="496" width="426.6666666666667" height="204" rx="12" fill="#eef1fb" stroke="#4758A2" stroke-width="2"/>
<text x="1109.3333333333335" y="521" font-size="14" font-weight="700" fill="#4758A2" text-anchor="start">ADAPTER</text>
<text x="1109.3333333333335" y="550" font-size="19" font-weight="700" fill="#182033" text-anchor="start">6 · Resolve runtime</text>
<text x="1109.3333333333335" y="583" font-size="16" font-weight="400" fill="#182033" text-anchor="start">No silent model/provider fallback. Native</text>
<text x="1109.3333333333335" y="604" font-size="16" font-weight="400" fill="#182033" text-anchor="start">credentials only.</text>
