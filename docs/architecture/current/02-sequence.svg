<g data-component="UI"><rect x="1093.3333333333335" y="778" width="426.6666666666667" height="204" rx="12" fill="#e7f3f5" stroke="#326672" stroke-width="2"/>
<text x="1109.3333333333335" y="803" font-size="14" font-weight="700" fill="#326672" text-anchor="start">UI</text>
<text x="1109.3333333333335" y="832" font-size="19" font-weight="700" fill="#182033" text-anchor="start">9 · Poll snapshot</text>
