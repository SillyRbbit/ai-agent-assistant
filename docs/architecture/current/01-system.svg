<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1456" role="img" aria-labelledby="title desc">
<title id="title">01 · System overview</title><desc id="desc">Local desktop coordination, explicit provider boundaries, no general device executor. Rows show distinct paths, not one serial workflow. Anthropic/local adapters have code and offline coverage; the accepted live matrix is OpenAI/Codex. Legacy Conversations includes mocks and a fixed native sample.</desc>
