[package]
name = "ai-agent-assistant"
version = "0.1.0"
description = "Secure local core for Cortexa"
authors = ["Cortexa contributors"]
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "ai_agent_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
tauri = { version = "=2.11.5", features = ["tray-icon"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[dev-dependencies]
tempfile = "=3.27.0"
